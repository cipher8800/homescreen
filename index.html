<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homescreen</title>
    <link rel="icon" href="favicon.png" type="image/x-icon" />
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
    <link href="vendor/bootstrap-icons-1.13.1/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/constants.js" defer></script>
    <script src="js/db.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/itemModal.js" defer></script>
    <script src="js/confirmModal.js" defer></script>
    <script src="js/searchBar.js" defer></script>
    <script src="js/toast.js" defer></script>
  </head>
  <body>
    <div class="app container">
      <header class="header">
        <div class="main-bar">
          <h1 class="title">Homescreen</h1>

          <div class="actions">
            <label class="search search-box">
              <input type="text" oninput="SearchBar.search(event.target.value)" placeholder="Type to search..." />
              <div class="clear" onclick="SearchBar.clear()">
                <i class="bi bi-search"></i>
              </div>
            </label>

            <button class="search-btn" onclick="SearchBar.toggle()">
              <i class="bi bi-search"></i>
            </button>

            <button class="settings" onclick="toggleSettingsModal()">
              <i class="bi bi-sliders2"></i>
            </button>
          </div>
        </div>

        <div class="search search-bar">
          <button class="exit" onclick="SearchBar.toggle()">
            <i class="bi bi-arrow-left"></i>
          </button>
          <label class="search-box">
            <input type="text" oninput="SearchBar.search(event.target.value)" placeholder="Type to search..." />
          </label>
          <button onclick="SearchBar.clear()" class="clear">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </header>

      <main>
        <div class="clock"></div>
        <div class="breadcrumbs"></div>
        <div class="action-bar">
          <button onclick="ItemModal.openCreate('shortcut')">
            <i class="bi bi-plus-circle"></i>
          </button>
          <button onclick="ItemModal.openCreate('text')">
            <i class="bi bi-file-earmark-plus"></i>
          </button>
          <button onclick="ItemModal.openCreate('folder')">
            <i class="bi bi-folder-plus"></i>
          </button>
          <button class="edit" onclick="editItem()">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="delete" onclick="deleteItem()">
            <i class="bi bi-trash"></i>
          </button>
          <label class="sort" onclick="toggleSort()">
            <i class="bi bi-sort-down"></i>
          </label>
        </div>

        <div class="item-container"></div>

        <!-- Item modal -->
        <div class="item-modal modal hidden" onclick="ItemModal.close()">
          <div class="modal-content" onclick="stopPropagation(event)">
            <button class="close" onclick="ItemModal.close()">
              <i class="bi bi-x-lg"></i>
            </button>
            <div class="title">Create new item</div>

            <div class="input-group">
              <label class="icon-input">
                <img src="assets/images/text.png" />
                <input type="file" class="hidden" accept="image/*" />
              </label>

              <input class="name-input" type="text" placeholder="Item name" />
            </div>

            <input class="url-input" type="text" placeholder="Item url" />

            <textarea class="content-input" placeholder="Enter your text here"></textarea>

            <div class="actions">
              <button class="submit button">Submit</button>
              <button class="delete button" onclick="deleteItem()">Delete</button>
            </div>
          </div>
        </div>

        <div class="toast-container hidden"></div>

        <!-- Settings modal -->
        <div class="settings-modal modal" hidden onclick="hide(this)">
          <div class="modal-content" onclick="stopPropagation(event)">
            <button class="close" onclick="toggleSettingsModal()">
              <i class="bi bi-x-lg"></i>
            </button>
            <div class="settings-header">
              <div class="settings-title">Settings</div>
              <div class="settings-subtitle">Customize your experience</div>
            </div>

            <label class="settings-item">
              <i class="bi bi-image"></i>
              
              <div class="settings-label">
                Wallpaper
                <span class="settings-description"> Change your background </span>
              </div>

              <div class="arrow">›</div>
              <input type="file" accept="image/*" hidden onchange="changeWallpaper(this.files[0])" />
            </label>

            <label class="settings-item">
              <i class="bi bi-moon"></i>

              <div class="settings-label">
                Dark theme
                <span class="settings-description theme-desc" id="themeText"> Enabled </span>
              </div>

              <label class="toggle">
                <input class="theme-checkbox" type="checkbox" onchange="toggleTheme()" />
                <span class="slider"></span>
              </label>
            </label>

            <label class="settings-item import">
              <i class="bi bi-box-arrow-in-down"></i>
              
              <div class="settings-label">
                Import
                <span class="settings-description"> Load your saved items </span>
              </div>

              <div class="arrow">›</div>
              <input type="file" accept=".json" hidden onchange="importData(this.files[0])" />
            </label>

            <div class="settings-item export" onclick="exportData()">
              <i class="bi bi-box-arrow-up"></i>
              <div class="settings-label">
                Export
                <span class="settings-description"> Save your items </span>
              </div>

              <div class="arrow">›</div>
            </div>
          </div>
        </div>

        <div class="confirm-modal modal" onclick="ConfirmModal.close()" hidden>
          <div class="modal-content" onclick="stopPropagation(event)">
            <button class="close" onclick="ConfirmModal.close()">
              <i class="bi bi-x-lg"></i>
            </button>
            <div class="title">Delete item</div>
            <div class="msg">Are you sure you want to delete "item"</div>
            
            <div class="actions">
              <button class="button confirm">Confirm</button>
              <button class="button cancel" onclick="ConfirmModal.close()">Cancel</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
